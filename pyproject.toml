[project]
name = "cvmdata"
version = "0.1.0"
description = "Pipeline de dados CVM para indicadores de análise fundamentalista"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2,<1.5",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pyclean>=3.7.0",
    "pytest>=8",
    "pytest-cov>=7.0.0",
    "ruff>=0.9",
]

[project.scripts]
cvmdata = "cvmdata.pipeline.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvmdata"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short"]
